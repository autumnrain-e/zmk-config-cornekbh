# Enable nice!view
CONFIG_ZMK_DISPLAY=y
# Disable idle blanking
CONFIG_ZMK_DISPLAY_BLANK_ON_IDLE=n

# Settings in this file apply only to builds that use this shield (the right half).
# Uncomment the line below to swap black and white on the right half's screen.
# Put it here rather than in config/corne.conf: that file is shared with the left
# half, whose build can't use this option and prints a warning about it.
# CONFIG_NICE_VIEW_CUSTOM_WIDGET_INVERTED=y

# How often the right half's screen switches to its next picture, in seconds.
# The pictures take turns in a random order, each one once per round, so with
# 6 pictures you see all of them every 6 changes. 0 = keep the picture picked
# at start. Default: 60. Nothing changes while the keyboard is in deep sleep.
CONFIG_NICE_VIEW_CUSTOM_WIDGET_ART_INTERVAL_SEC=60
