# Enable nice!view
CONFIG_ZMK_DISPLAY=y
# Disable idle blanking
CONFIG_ZMK_DISPLAY_BLANK_ON_IDLE=n

# Settings in this file apply only to builds that use this shield (the right half).
# Uncomment the line below to swap black and white on the right half's screen.
# Don't put it in config/corne.conf: that file is shared with the left half, whose
# build doesn't know this option and would fail.
# CONFIG_NICE_VIEW_CUSTOM_WIDGET_INVERTED=y
